<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B1C2C">
<title>Hinário EJC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
/* Layout: uma coluna de leitura (hinário de bolso); lista por dia -> música -> edição com folha inferior. */
:root{
  --paper:#FBF8F7; --card:#FFFFFF; --ink:#2B1D1F; --muted:#7A6A6C; --line:#EADFDF;
  --wine:#9B1C2C; --wine-soft:#F6E4E6; --chord:#1D5C8C; --men:#F7B3AE; --ok:#2F7A4D;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17110F; --card:#211917; --ink:#F2E9E7; --muted:#B19E9B; --line:#3A2E2C;
  --wine:#F08A93; --wine-soft:#3A1F22; --chord:#86C3F0; --men:#6E2A2A; --ok:#7CCB98; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17110F; --card:#211917; --ink:#F2E9E7; --muted:#B19E9B; --line:#3A2E2C;
  --wine:#F08A93; --wine-soft:#3A1F22; --chord:#86C3F0; --men:#6E2A2A; --ok:#7CCB98; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chord);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--display);font-size:22px;font-weight:700;color:var(--wine);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;line-height:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.iconbtn.on{background:var(--wine);border-color:var(--wine);color:var(--paper)}
.primary{background:var(--wine);color:var(--paper);border:0;border-radius:10px;height:42px;padding:0 16px;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;height:42px;padding:0 14px;font-weight:600}
.danger{color:#B3261E;border-color:#E9B8B4}

.tabs{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;margin-bottom:10px}

.note{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;color:var(--muted);margin-block:14px}
.note b{color:var(--ink)}

.list{list-style:none;margin:0;padding:0 0 40px}
.dayhead{font-family:var(--display);color:var(--wine);font-size:20px;margin:22px 0 4px;display:flex;align-items:baseline;gap:8px}
.dayhead span{font-family:var(--body);font-size:13px;color:var(--muted)}
.grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.row .num{font-variant-numeric:tabular-nums;color:var(--wine);font-weight:700;width:28px;flex:none;text-align:right}
.row .t{flex:1;min-width:0;font-size:17px}
.row .tag{font-family:var(--mono);font-size:11px;color:var(--chord);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.trash{margin-top:28px}
.trash summary{color:var(--muted);font-weight:600;cursor:pointer}
.trash li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}

/* música */
.song{padding-bottom:200px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:18px}
.stitle{font-family:var(--display);font-weight:500;color:var(--wine);font-size:30px;line-height:1.15;margin:2px 0 4px;text-wrap:balance}
.stitle .n{font-family:var(--body);font-weight:700;font-size:18px;margin-right:8px}
.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.tom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);height:40px}
.tom button{border:0;background:none;width:38px;height:38px;font-weight:700;font-size:18px}
.tom output{min-width:56px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--chord)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend i{font-style:normal}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}

.lyrics{font-size:var(--fs)}
.stanza{margin-bottom:1.1em}
.p{margin:0 0 .35em;line-height:1.5;overflow-wrap:anywhere}
.p.hasch{line-height:1.4;margin-bottom:.7em}
.pre{font-family:var(--mono);font-weight:700;color:var(--chord);font-size:.82em;margin:.4em 0 .15em;white-space:pre-wrap}
.v-t{font-weight:700}
.v-h{background:var(--men);border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.v-i{font-style:italic;color:var(--muted)}
.wd{white-space:nowrap}
.cw{display:inline-block;vertical-align:baseline}
.cl{display:block;font-family:var(--mono);font-weight:700;font-size:.82em;line-height:1.3;color:var(--chord);padding-right:.3em;margin-bottom:.05em;white-space:pre;font-style:normal}
.ct{white-space:pre}
.cl0{padding:0;width:0}
.nochords .cl,.nochords .pre{display:none}
.nochords .p.hasch{line-height:1.5;margin-bottom:.35em}

/* edição */
.editing .p{line-height:1.6}
.editing .p .cl0{min-height:1.6em;display:block}
.pill{font-family:var(--mono);font-weight:700;font-size:.82em;color:var(--chord);background:var(--card);border:1.5px solid var(--chord);border-radius:7px;padding:1px 6px;margin:0 3px 3px 0;line-height:1.25;min-width:1.8em;cursor:pointer}
.pill.sel{background:var(--chord);color:var(--paper)}
.pill-input{font-family:var(--mono);font-weight:700;font-size:.82em;color:var(--chord);background:var(--paper);border:2px solid var(--chord);border-radius:7px;padding:1px 4px;margin:0 3px 3px 0;line-height:1.25;width:auto;outline:none}
.editing .k{cursor:text;border-bottom:1px dotted transparent}
.editing .k:hover{border-bottom-color:var(--muted);background:none}
.ebhint{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.ebhint b{color:var(--ink)}
.more{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.more summary{cursor:pointer;font-weight:600;color:var(--muted);margin-bottom:10px}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;padding-block:8px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.selbar .wrap{display:flex;gap:8px;align-items:center}
.selbar .sel-label{font-size:13px;color:var(--muted);font-weight:700}
.selbar button{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:18px;max-width:72px}
.selbar button.perigo{color:#C62828}
.selbar button.ok{background:var(--chord);border-color:var(--chord);color:var(--paper);font-size:15px;font-weight:700;flex:0 0 auto;padding:0 18px;max-width:none}
.tag.ed{color:var(--wine);border-color:var(--wine-soft);background:var(--wine-soft)}
.editing .cl.k{cursor:pointer;background:var(--wine-soft);border-radius:4px;padding:0 .3em;margin-right:.15em}
.editing .k{cursor:pointer;border-radius:3px}
.editing .k:hover{background:var(--wine-soft)}
.editing .k.sel{background:var(--chord);color:var(--paper)}
.editbanner{border:1px dashed var(--chord);color:var(--ink);background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.warn{border-color:#C9822B}
.metaform{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:14px}
.metaform label{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.metaform .full{grid-column:1/-1}
.metaform input,.metaform select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.savebar .grow{flex:1}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)}
textarea.src{width:100%;min-height:55vh;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-family:var(--mono);font-size:14px;line-height:1.6}
.mk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mk button{border:1px solid var(--line);background:var(--card);border-radius:8px;height:36px;padding:0 10px;font-size:14px}
.help{font-size:13px;color:var(--muted);margin:8px 0 0}
.help code{font-family:var(--mono);color:var(--chord)}

/* folha do acorde */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{margin:0;font-size:15px;color:var(--muted);font-weight:600}
.sheet .ctx{font-size:15px;margin:6px 0 10px}
.sheet .ctx b{background:var(--chord);color:var(--paper);border-radius:3px;padding:0 2px}
.chordval{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.chordval input{flex:1;min-width:0;height:46px;border:2px solid var(--chord);border-radius:10px;background:var(--paper);font-family:var(--mono);font-size:20px;padding:0 12px;color:var(--chord)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.grid button,.quals button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--mono);font-size:15px}
.quals{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quals button{padding:0 10px}
.sheetrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheetrow .grow{flex:1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
@media (max-width:420px){.metaform{grid-template-columns:1fr}.stitle{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="iconbtn" id="back" hidden aria-label="Voltar para a lista">←</button>
      <h1 class="brand" id="brand"><small>Encontro de Jovens com Cristo</small>Hinário EJC 2026</h1>
      <button class="iconbtn" id="chordToggle" aria-pressed="true" title="Mostrar ou esconder a cifra">Cifra</button>
    </div>
    <div id="listControls">
      <input class="search" id="q" type="search" placeholder="Buscar música ou trecho da letra" autocomplete="off">
      <div class="tabs" id="tabs" role="group" aria-label="Dia"></div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="note" id="loading"><b>Carregando as músicas…</b><br>Elas ficam salvas online e aparecem iguais para todo mundo.</div>
</main>

<div id="savebarHost"></div>
<div id="sheetHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Configuração do banco (Supabase). A chave "anon" é pública por natureza: quem edita precisa da senha da equipe. */
const SUPABASE_URL = 'https://ggvsiopkjzlwaqclhmfw.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndnNpb3Branpsd2FxY2xobWZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NzU3NzIsImV4cCI6MjEwOTQ1MTc3Mn0.8BLvRjG4kKxQI3NkW_rVn-V-1Wh1kHW7fGD5O_5QGpA';
(() => {
const DAYS = [['sexta','Sexta','18 de dezembro'],['sabado','Sábado','19 de dezembro'],['domingo','Domingo','20 de dezembro']];
const DAYNAME = Object.fromEntries(DAYS.map(d => [d[0], d[1]]));
const S = { songs: [], trash: [], db: null, user: null, uid: null, canWrite: null, loaded: false,
  day: 'todas', q: '', cur: null, edit: null, textMode: false, sheet: null, saving: false, msg: '', names: {} };
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const store = { get(k, d) { try { const v = localStorage.getItem('ejc.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('ejc.' + k, JSON.stringify(v)); } catch {} } };

let showChords = store.get('chords', true), fontSize = store.get('fs', 18);
document.documentElement.style.setProperty('--fs', fontSize + 'px');

/* ---------- acordes / transposição ---------- */
const SH = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
const IDX = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const tr1 = (root, k) => IDX[root] == null ? root : SH[(IDX[root] + k + 120) % 12];
const trChord = (ch, k) => !k ? ch : ch.replace(/(^|\/|\s|\()([A-G](?:#|b)?)/g, (m, p, r) => p + tr1(r, k));
const TOKEN = /^\(?([A-G][#b]?)((?:m|maj|min|dim|aug|sus|add|M|º|°|\+|-|\d|\(|\)|#|b)*)(\/[A-G][#b]?)?\)?$/;
const trLine = (line, k) => !k ? line : line.split(/(\s+)/).map(t => TOKEN.test(t) ? trChord(t, k) : t).join('');

/* ---------- formato de texto para edição ---------- */
// *todos*  {homens}  <instrução>  mulheres sem marca  [G] acorde  "> " linha só de acordes  linha em branco = nova estrofe
const OPEN = { t: '*', h: '{', i: '<' }, CLOSE = { t: '*', h: '}', i: '>' };
function paraToText(p) {
  const ch = {}; (p.c || []).forEach(([o, c]) => (ch[o] = ch[o] ? ch[o] + ' ' + c : c));
  let s = '', pos = 0;
  for (const r of p.r) {
    let seg = '';
    for (const c of r.t) { if (ch[pos]) seg += '[' + ch[pos] + ']'; seg += c; pos++; }
    s += r.v === 'm' ? seg : OPEN[r.v] + seg + CLOSE[r.v];
  }
  Object.keys(ch).map(Number).filter(o => o >= pos).forEach(o => (s += '[' + ch[o] + ']'));
  return s;
}
function songToText(song) {
  const out = song.st.map(st => st.map(p => [...(p.pre || []).map(l => '> ' + l), paraToText(p)].join('\n')).join('\n')).join('\n\n');
  return out + ((song.tail || []).length ? '\n\n' + song.tail.map(l => '> ' + l).join('\n') : '');
}
function textToPara(line) {
  const runs = [], c = []; let v = 'm', buf = '', pos = 0;
  const flush = () => { if (!buf) return; if (runs.length && runs[runs.length - 1].v === v) runs[runs.length - 1].t += buf; else runs.push({ t: buf, v }); buf = ''; };
  for (let i = 0; i < line.length; i++) {
    const x = line[i];
    if (x === '[') { const j = line.indexOf(']', i); if (j > i) { const name = line.slice(i + 1, j).trim(); if (name) c.push([pos, name]); i = j; continue; } }
    if (x === '*') { flush(); v = v === 't' ? 'm' : 't'; continue; }
    if (x === '{') { flush(); v = 'h'; continue; }
    if (x === '}') { flush(); v = 'm'; continue; }
    if (x === '<') { flush(); v = 'i'; continue; }
    if (x === '>') { flush(); v = 'm'; continue; }
    buf += x; pos++;
  }
  flush();
  const p = { r: runs.length ? runs : [{ t: '', v: 'm' }] };
  if (c.length) p.c = c;
  return p;
}
function textToSong(text) {
  const st = []; let cur = [], pre = [];
  const lines = text.replace(/\r/g, '').split('\n');
  const endStanza = () => { if (cur.length) st.push(cur); cur = []; };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { endStanza(); continue; }
    if (/^>\s?/.test(line)) { pre.push(line.replace(/^>\s?/, '')); continue; }
    const p = textToPara(line);
    if (pre.length) { p.pre = pre; pre = []; }
    cur.push(p);
  }
  endStanza();
  return { st, tail: pre };
}

/* ---------- render ---------- */
function paraHTML(p, si, pi, k, edit, selCi) {
  const ch = {}, ids = {};
  (p.c || []).forEach(([o, c], ci) => { ch[o] = (ch[o] ? ch[o] + ' ' : '') + trChord(c, k); (ids[o] = ids[o] || []).push(ci); });
  const chars = []; p.r.forEach(r => { for (const c of r.t) chars.push({ c, v: r.v }); });
  const N = chars.length;
  const has = a => ch[a] != null;
  const one = i => { const c = chars[i].c, e = c === ' ' ? (has(i) ? '&nbsp;' : ' ') : esc(c);
    return edit ? `<span class="k" data-o="${i}">${e}</span>` : e; };
  const run = (a, b) => { let s = '', i = a;
    while (i < b) { const v = chars[i].v; let t = ''; while (i < b && chars[i].v === v) { t += one(i); i++; } s += `<span class="v-${v}">${t}</span>`; }
    return s; };
  const label = a => {
    if (!has(a)) return '<span class="cl cl0">&#8203;</span>';
    if (!edit) return `<span class="cl">${esc(ch[a])}</span>`;
    return `<span class="cl">${ids[a].map(ci => `<button type="button" class="pill${selCi === ci ? ' sel' : ''}" data-ci="${ci}">${esc(p.c[ci][1]) || '?'}</button>`).join('')}</span>`;
  };
  let out = '', i = 0;
  while (i < N) {
    if (chars[i].c === ' ' && !has(i)) { out += run(i, i + 1); i++; continue; }
    let j = i + 1;
    if (chars[i].c !== ' ') while (j < N && chars[j].c !== ' ') j++;
    const cuts = []; for (let x = i + 1; x < j; x++) if (has(x)) cuts.push(x);

document.addEventListener('click', ev => {
  const t = ev.target.closest('.pill, button, .k'); if (!t) return;
  if (t.matches('.tab')) { S.day = t.dataset.day; store.set('day', S.day); return render(); }
  if (t.dataset.open) { S.cur = t.dataset.open; S.showHist = false; location.hash = 'm-' + S.cur; window.scrollTo(0, 0); return render(); }
  if (t.id === 'back') { if (S.edit && S.edit.dirty && !S.edit.leaveOk) { S.edit.leaveOk = true; S.msg = 'Você tem alterações não salvas. Toque em ← de novo para sair sem salvar.'; return renderSaveBar(); }
    S.cur = null; S.edit = null; S.sheet = null; location.hash = ''; return render(); }
  if (t.id === 'chordToggle') { showChords = !showChords; store.set('chords', showChords); return render(); }
  if (t.dataset.tom) { const k = (store.get('tom.' + S.cur, 0) + +t.dataset.tom + 18) % 12 - 6; store.set('tom.' + S.cur, k); return render(); }
  if (t.dataset.fs) { fontSize = Math.min(28, Math.max(14, fontSize + 2 * t.dataset.fs)); store.set('fs', fontSize); document.documentElement.style.setProperty('--fs', fontSize + 'px'); return; }
  if (t.id === 'startEdit') { if (needLogin()) { S.login = 'edit'; return render(); } return startEdit(); }
  if (t.id === 'lCancel') { S.login = null; return render(); }
  if (t.id === 'showHist') { S.showHist = !S.showHist; return render(); }
  if (t.dataset.revert != null) { const base = S.songs.find(s => s.id === S.cur); const v = base.hist[+t.dataset.revert];
    startEdit(); Object.assign(S.edit.draft, clone({ title: v.title, day: v.day, group: v.group, st: v.st, tail: v.tail || [] }));
    S.edit.text = songToText(S.edit.draft); markDirty(); S.msg = 'Versão carregada. Toque em “Salvar para todos” para confirmar.'; return render(); }
  if (t.id === 'newSong') { if (needLogin()) { S.login = 'new'; window.scrollTo(0, 0); return render(); } return newSong(); }
  if (t.id === 'logout') { store.set('senha', ''); S.canWrite = null; (S.unsubs || []).forEach(u => u()); S.db = makeDb(''); subscribeAll(); return render(); }
  if (t.dataset.restore) return restoreTrash(t.dataset.restore);
  if (!S.edit) return;
  if (t.id === 'cancelEdit') { S.edit = null; S.sheet = null; S.selc = null; S.msg = ''; return render(); }
  if (t.id === 'saveEdit') return save();
  if (t.id === 'modeText') { readMeta(); syncText(); S.textMode = !S.textMode; S.moreOpen = true; if (S.textMode) S.edit.text = songToText(S.edit.draft); S.selc = null; return render(); }
  if (t.id === 'moveUp' || t.id === 'moveDown') return swapOrder(t.id === 'moveUp' ? -1 : 1);
  if (t.id === 'delSong') { S.edit.confirmDel = true; S.moreOpen = true; readMeta(); syncText(); return render(); }
  if (t.id === 'delNo') { S.edit.confirmDel = false; return render(); }
  if (t.id === 'delYes') return deleteSong();
  if (t.matches('.pill')) {
    const pEl = t.closest('.p'), s = +pEl.dataset.s, pi = +pEl.dataset.p, ci = +t.dataset.ci;
    const now = Date.now(), same = S.selc && S.selc.s === s && S.selc.p === pi && S.selc.ci === ci;
    if (same && now - (S.lastTap || 0) < 450) { S.lastTap = 0; return inlineEdit(s, pi, ci, false); }
    S.lastTap = now; return selectChord(s, pi, ci);
  }
  if (t.matches('.k')) { readMeta(); const pEl = t.closest('.p'); return addChordAt(+pEl.dataset.s, +pEl.dataset.p, +t.dataset.o); }
  if (t.id === 'selL') return moveChord(-1);
  if (t.id === 'selR') return moveChord(1);
  if (t.id === 'selEd') return S.selc && inlineEdit(S.selc.s, S.selc.p, S.selc.ci, false);
  if (t.id === 'selDel') return deleteChord();
  if (t.id === 'selOk') { S.selc = null; return render(); }
  if (t.id === 'origEdit') { readMeta(); return loadOriginal(); }
  if (t.dataset.wrap != null) { const ta = $('#src'); if (!ta) return; const [o, c] = t.dataset.wrap.split('|');
    const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
    let sel = v.slice(a, b);
    if (o === '' ) sel = sel.replace(/[*{}<>]/g, '');
    if (o === '> ') { const ls = v.lastIndexOf('\n', a - 1) + 1; ta.value = v.slice(0, ls) + '> ' + v.slice(ls); ta.selectionStart = ta.selectionEnd = b + 2; }
    else { ta.value = v.slice(0, a) + o + sel + c + v.slice(b); const pos = sel ? a + o.length + sel.length + c.length : a + o.length; ta.selectionStart = ta.selectionEnd = pos; }
    ta.focus(); S.edit.text = ta.value; markDirty(); renderSaveBar(); return; }
  if (S.sheet) {
    const sh = S.sheet, inp = $('#chIn');
    if (t.dataset.root) { const cur = inp.value; const slash = cur.lastIndexOf('/');
      inp.value = slash >= 0 && slash === cur.length - 1 ? cur + t.dataset.root : t.dataset.root + (cur.match(/^[A-G][#b]?(.*)$/) || [, ''])[1];
      sh.val = inp.value; return; }
    if (t.dataset.qual != null) { const q = t.dataset.qual; const m = inp.value.match(/^([A-G][#b]?)(.*?)(\/.*)?$/);
      if (q === '/') inp.value = (inp.value.split('/')[0] || 'C') + '/'; else inp.value = (m ? m[1] : 'C') + q + (m && m[3] ? m[3] : '');
      sh.val = inp.value; return; }
    if (t.dataset.nudge) { sh.val = inp.value; const len = S.edit.draft.st[sh.s][sh.p].r.reduce((n, r) => n + r.t.length, 0);
      sh.o = Math.max(0, Math.min(len, sh.o + +t.dataset.nudge)); render(); return; }
    if (t.id === 'chOk') return applySheet(false);
    if (t.id === 'chDel') return applySheet(true);
    if (t.id === 'chCancel') { S.sheet = null; return render(); }
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { S.q = ev.target.value; renderList(); return; }
  if (!S.edit) return;
  if (ev.target.id === 'src') { S.edit.text = ev.target.value; markDirty(); const st = $('#status'); if (st) st.textContent = 'Alterações ainda não salvas'; }
  if (['fTitle', 'fDay', 'fGroup'].includes(ev.target.id)) { readMeta(); markDirty(); const st = $('#status'); if (st) st.textContent = 'Alterações ainda não salvas'; }
  if (ev.target.id === 'chIn' && S.sheet) S.sheet.val = ev.target.value;
});
document.addEventListener('keydown', ev => {
  if (!S.edit || S.textMode || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  const k = ev.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') { ev.preventDefault(); if (!S.selc) stepSelection(1); else moveChord(k === 'ArrowLeft' ? -1 : 1); }
  else if (k === 'ArrowUp') { ev.preventDefault(); stepSelection(-1); }
  else if (k === 'ArrowDown') { ev.preventDefault(); stepSelection(1); }
  else if (k === 'Enter' && S.selc) { ev.preventDefault(); inlineEdit(S.selc.s, S.selc.p, S.selc.ci, false); }
  else if ((k === 'Delete' || k === 'Backspace') && S.selc) { ev.preventDefault(); deleteChord(); }
  else if (k === 'Escape' && S.selc) { S.selc = null; render(); }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'more') S.moreOpen = ev.target.open; }, true);
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#m-(.+)$/); if (!S.edit) { S.cur = m ? m[1] : null; render(); } });

/* ---------- dados (Supabase: tabela hinario_docs(col, id, data)) ---------- */
let client = null;
function makeDb(senha) {
  client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    global: { headers: senha ? { 'x-senha': senha } : {} }, auth: { persistSession: false } });
  const fail = error => { const e = new Error(error.message); e.code = /row-level|42501|permission|PGRST116/i.test((error.message || '') + (error.code || '')) ? 'invalid_argument' : 'unavailable'; throw e; };
  return {
    collection(col) {
      return {
        doc(id) { return {
          async set(data) { const { error } = await client.from('hinario_docs').upsert({ col, id, data }); if (error) fail(error); },
          async update(patch) {
            const { data: row, error: e1 } = await client.from('hinario_docs').select('data').eq('col', col).eq('id', id).maybeSingle();
            if (e1) fail(e1); if (!row) fail({ message: 'row-level' });
            const { error } = await client.from('hinario_docs').update({ data: { ...row.data, ...patch } }).eq('col', col).eq('id', id).select('id').single();
            if (error) fail(error); },
          async delete() { const { error, count } = await client.from('hinario_docs').delete({ count: 'exact' }).eq('col', col).eq('id', id); if (error) fail(error); if (!count) fail({ message: 'row-level' }); },
        }; },
        onSnapshot(next, onErr) {
          let alive = true, t = null;
          const load = async () => {
            const { data, error } = await client.from('hinario_docs').select('id,data').eq('col', col);
            if (!alive) return; if (error) { onErr && onErr(error); return; }
            next({ docs: data.map(r => ({ id: r.id, data: () => r.data })), metadata: { fromCache: false } });
          };
          const soon = () => { clearTimeout(t); t = setTimeout(load, 250); };
          const vis = () => { if (!document.hidden) load(); };
          load();
          const ch = client.channel('docs-' + col + '-' + Math.random().toString(36).slice(2))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'hinario_docs', filter: 'col=eq.' + col }, soon).subscribe();
          const poll = setInterval(load, 30000);
          document.addEventListener('visibilitychange', vis);
          return () => { alive = false; clearInterval(poll); document.removeEventListener('visibilitychange', vis); client.removeChannel(ch); };
        },
      };
    },
  };
}
async function login(nome, senha) {
  const test = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { headers: { 'x-senha': senha } }, auth: { persistSession: false } });
  const { data, error } = await test.rpc('hinario_senha_ok');
  if (error) return 'Não deu para conferir a senha agora. Confira a internet.';
  if (data !== true) return 'Senha errada. Confira com a coordenação.';
  store.set('senha', senha); store.set('nome', nome);
  S.uid = nome; S.canWrite = true;
  (S.unsubs || []).forEach(u => u());
  S.db = makeDb(senha); subscribeAll();
  return null;
}
function loginHTML() {
  return `<form class="note" id="loginForm" style="color:var(--ink)"><b>Para editar, entre com a senha da equipe.</b>
    <div class="metaform" style="margin:10px 0 0">
      <label>Seu nome<input id="lNome" value="${esc(store.get('nome', ''))}" autocomplete="name" required></label>
      <label>Senha da equipe<input id="lSenha" type="password" autocomplete="current-password" required></label>
    </div>
    <div class="confirm"><span class="status" id="lMsg"></span><span class="grow"></span><button type="button" class="ghost" id="lCancel">Cancelar</button><button class="primary" id="lOk">Entrar</button></div></form>`;
}
const needLogin = () => !store.get('senha', '');
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'loginForm') return;
  ev.preventDefault();
  const nome = $('#lNome').value.trim(), senha = $('#lSenha').value;
  if (!nome) { $('#lMsg').textContent = 'Escreva seu nome.'; return; }
  $('#lMsg').textContent = 'Conferindo…';
  const err = await login(nome, senha);
  if (err) { $('#lMsg').textContent = err; return; }
  const next = S.login; S.login = null;
  if (next === 'new') newSong(); else if (S.cur) startEdit(); else render();
});
S.day = store.get('day', 'todas');
{ const m = location.hash.match(/^#m-(.+)$/); if (m) S.cur = m[1]; }
render();

let loadTimer = null;
function subscribeAll() {
  const db = S.db;
  S.unsubs = [db.collection('songs').onSnapshot(snap => {
    S.songs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache || S.songs.length) { S.loaded = true; clearTimeout(loadTimer); }
    if (S.edit && S.cur) { const b = S.songs.find(s => s.id === S.cur); if (b && (b.at || 0) !== S.edit.baseAt && b.by !== S.uid) S.edit.remote = true; }
    resolveNames(S.songs.map(s => s.by).filter(Boolean));
    if (S.edit && S.textMode) { const ta = $('#src'); if (ta) S.edit.text = ta.value; readMeta(); }
    if (S.sheet) { const i = $('#chIn'); if (i) S.sheet.val = i.value; }
    if (!(S.edit && S.textMode && document.activeElement && document.activeElement.id === 'src')) render(); else renderSaveBar();
  }, err => { clearTimeout(loadTimer); if (!S.loaded) { S.loaded = true; main.innerHTML = `<div class="note"><b>Não deu para carregar as músicas.</b><br>Confira a internet e abra o link de novo.</div>`; } }),
  db.collection('trash').onSnapshot(snap => { S.trash = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (!S.cur && !S.login) renderList(); }, () => {})];
}
(async () => {
  if (!window.supabase || /COLE_AQUI/.test(SUPABASE_URL)) { main.innerHTML = `<div class="note"><b>O hinário ainda não foi conectado ao banco de dados.</b><br>Assim que a configuração do Supabase for colocada, as músicas aparecem aqui.</div>`; return; }
  S.db = makeDb(store.get('senha', ''));
  S.uid = store.get('nome', '') || null;
  loadTimer = setTimeout(() => { if (!S.loaded) main.innerHTML = `<div class="note"><b>As músicas estão demorando para chegar.</b><br>Confira a internet. Elas aparecem sozinhas assim que a conexão voltar.</div>`; }, 10000);
  subscribeAll();
})();
})();
</script>
